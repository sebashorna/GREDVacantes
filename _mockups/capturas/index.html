<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mockups - App móvil Educa Lambayeque</title>
  <style>
    :root { --bg:#fff8f6; --primary:#a0472e; --text:#1f1b1a; --muted:#55423d; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Plus Jakarta Sans',system-ui,sans-serif; background:var(--bg); color:var(--text); padding:2rem 1rem; }
    h1 { text-align:center; color:var(--primary); margin-bottom:.25rem; }
    p.sub { text-align:center; color:var(--muted); margin-bottom:2rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:2rem; max-width:1400px; margin:0 auto; }
    .card { background:#fff; border:1px solid rgba(221,184,146,.4); border-radius:1rem; padding:1rem; box-shadow:0 2px 8px -2px rgba(160,71,46,.06),0 1px 3px 0 rgba(43,38,37,.04); text-align:center; }
    .card h2 { font-size:1.05rem; margin:.5rem 0 .75rem; color:var(--primary); }
    .frame { display:inline-block; border:8px solid #1f1b1a; border-radius:2rem; overflow:hidden; background:#000; }
    .frame img { display:block; width:240px; height:auto; }
    .meta { font-size:.75rem; color:var(--muted); margin-top:.5rem; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <h1>Mockups · App móvil Educa Lambayeque</h1>
  <p class="sub">Capturas de las 6 pantallas de la app móvil.</p>
  <div class="grid">
    <div class="card"><div class="frame"><img src="01-dashboard.png" alt="Dashboard" loading="lazy" /></div><h2>01 · Dashboard</h2><div class="meta">/dashboard</div></div>
    <div class="card"><div class="frame"><img src="02-convocatorias.png" alt="Convocatorias" loading="lazy" /></div><h2>02 · Convocatorias</h2><div class="meta">/convocatorias</div></div>
    <div class="card"><div class="frame"><img src="03-plazas.png" alt="Plazas" loading="lazy" /></div><h2>03 · Plazas docentes</h2><div class="meta">/plazas</div></div>
    <div class="card"><div class="frame"><img src="04-vacantes.png" alt="Vacantes" loading="lazy" /></div><h2>04 · Vacantes de matrícula</h2><div class="meta">/vacantes</div></div>
    <div class="card"><div class="frame"><img src="05-alertas.png" alt="Alertas" loading="lazy" /></div><h2>05 · Alertas</h2><div class="meta">/alertas</div></div>
    <div class="card"><div class="frame"><img src="06-infraestructura.png" alt="Infraestructura" loading="lazy" /></div><h2>06 · Infraestructura y aulas</h2><div class="meta">/infraestructura</div></div>
  </div>
</body>
</html>
